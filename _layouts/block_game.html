<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Block Puzzle 3D</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #0c0c0c 0%, #1a1a2e 50%, #16213e 100%);
            color: #ffffff;
            font-family: 'Courier New', monospace;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            padding: 10px;
            touch-action: none;
        }

        .game-container {
            text-align: center;
            padding: 20px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            max-width: 95vw;
        }

        .game-title {
            font-size: clamp(1.5rem, 4vw, 2.2rem);
            font-weight: bold;
            margin-bottom: 10px;
            background: linear-gradient(45deg, #00ff88, #00ccff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 20px rgba(0, 255, 136, 0.3);
        }

        .game-subtitle {
            font-size: clamp(0.8rem, 2vw, 1rem);
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 20px;
        }

        #gameCanvas {
            border: 2px solid rgba(0, 255, 136, 0.5);
            border-radius: 8px;
            background: rgba(0, 0, 0, 0.3);
            box-shadow:
                0 0 20px rgba(0, 255, 136, 0.2),
                inset 0 0 20px rgba(0, 0, 0, 0.3);
            max-width: 90vw;
            max-height: 60vh;
            display: block;
            margin: 0 auto;
            touch-action: none;
        }

        .game-info {
            display: flex;
            justify-content: space-around;
            align-items: center;
            margin: 20px 0;
            font-size: clamp(0.9rem, 2.5vw, 1.1rem);
            font-weight: bold;
            flex-wrap: wrap;
            gap: 15px;
        }

        .info-item {
            color: #00ff88;
            text-shadow: 0 0 10px rgba(0, 255, 136, 0.5);
        }

        .controls {
            margin-top: 20px;
            font-size: clamp(0.7rem, 2vw, 0.85rem);
            color: rgba(255, 255, 255, 0.6);
            line-height: 1.6;
        }

        .controls kbd {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 4px;
            padding: 2px 6px;
            font-family: inherit;
            font-size: 0.85em;
            margin: 0 2px;
        }

        .win-message {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            background: rgba(0, 0, 0, 0.9);
            padding: 40px;
            border-radius: 15px;
            text-align: center;
            border: 2px solid rgba(0, 255, 136, 0.5);
            z-index: 1000;
            transition: transform 0.3s ease;
        }

        .win-message.show {
            transform: translate(-50%, -50%) scale(1);
        }

        .win-message h2 {
            color: #00ff88;
            font-size: clamp(1.5rem, 4vw, 2rem);
            margin-bottom: 15px;
            text-shadow: 0 0 15px rgba(0, 255, 136, 0.5);
        }

        .win-message button {
            background: linear-gradient(45deg, #00ff88, #00ccff);
            color: #000;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-family: inherit;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 15px;
            transition: all 0.3s ease;
        }

        .win-message button:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(0, 255, 136, 0.3);
        }

        .button-group {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 15px;
            flex-wrap: wrap;
        }

        .btn {
            background: rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 8px 16px;
            border-radius: 8px;
            font-family: inherit;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
        }

        .btn:active {
            transform: scale(0.95);
        }

        .passcode-indicator {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(255, 255, 255, 0.1);
            padding: 8px 12px;
            border-radius: 8px;
            font-size: clamp(0.7rem, 2vw, 0.85rem);
            border: 1px solid rgba(255, 255, 255, 0.2);
            font-family: 'Courier New', monospace;
            letter-spacing: 2px;
        }

        .passcode-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            backdrop-filter: blur(10px);
        }

        .passcode-modal.show {
            display: flex;
        }

        .passcode-content {
            background: rgba(26, 26, 46, 0.95);
            border: 2px solid rgba(0, 255, 136, 0.5);
            border-radius: 15px;
            padding: 30px;
            max-width: 400px;
            width: 90%;
            text-align: center;
        }

        .passcode-title {
            font-size: 1.5rem;
            font-weight: bold;
            background: linear-gradient(45deg, #00ff88, #00ccff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 20px;
        }

        .passcode-input-container {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin: 20px 0;
        }

        .passcode-input {
            width: 50px;
            height: 60px;
            font-size: 1.8rem;
            font-weight: bold;
            text-align: center;
            background: rgba(0, 0, 0, 0.3);
            border: 2px solid rgba(0, 255, 136, 0.3);
            border-radius: 8px;
            color: #00ff88;
            font-family: 'Courier New', monospace;
            text-transform: uppercase;
        }

        .passcode-input:focus {
            outline: none;
            border-color: #00ff88;
            box-shadow: 0 0 10px rgba(0, 255, 136, 0.3);
        }

        .passcode-input.error {
            border-color: #ff4444;
            animation: shake 0.5s;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        .passcode-message {
            color: #ff4444;
            font-size: 0.9rem;
            min-height: 20px;
            margin-top: 10px;
        }

        .passcode-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 20px;
        }

        .passcode-btn {
            background: linear-gradient(45deg, #00ff88, #00ccff);
            color: #000;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-family: inherit;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .passcode-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(0, 255, 136, 0.3);
        }

        .passcode-cancel {
            background: rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .level-select-btn {
            position: absolute;
            bottom: 10px;
            right: 10px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: rgba(255, 255, 255, 0.8);
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .level-select-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
        }

        /* Hide on mobile/touch devices */
        @media (hover: none) and (pointer: coarse) {
            .kbd-controls {
                display: none;
            }

            .kbd-controls::after {
                content: "Swipe to move the block";
                display: block;
            }
        }

        .loading {
            color: rgba(255, 255, 255, 0.7);
            font-size: 1.2rem;
            padding: 20px;
        }
    </style>
</head>

<body>

        // Parse level layout text into grid data
        function parseLevelLayout(layoutText) {
            const lines = layoutText.trim().split('\n').map(line => line.trim());
            const grid = [];
            const bridges = {}; // Store bridge tile info by ID
            const switches = {}; // Store switch info by ID
            let start = { x: 1, y: 1 };

            lines.forEach((line, y) => {
                const tiles = line.split(/\s+/);
                const row = [];

                tiles.forEach((tile, x) => {
                    const parsed = parseTile(tile, x, y);
                    row.push(parsed);

                    if (parsed.type === 'start') {
                        start = { x: x, y: y };
                    }

                    // Track bridges and switches for linking
                    if (parsed.type === 'bridge') {
                        if (!bridges[parsed.id]) bridges[parsed.id] = [];
                        bridges[parsed.id].push({ x, y });
                    }
                    if (parsed.type === 'switch') {
                        if (!switches[parsed.id]) switches[parsed.id] = [];
                        switches[parsed.id].push({ x, y, mode: parsed.mode });
                    }
                });

                grid.push(row);
            });

            return { grid, bridges, switches, start };
        }

        function parseTile(tileStr, x, y) {
            tileStr = tileStr.trim();

            // Player start (always a plain tile)
            if (tileStr === '*') {
                return { type: 'start', value: 1 };
            }

            // Empty/hole
            if (tileStr === '0') {
                return { type: 'empty', value: 0 };
            }

            // Plain tile
            if (tileStr === '1') {
                return { type: 'normal', value: 1 };
            }

            // Exit
            if (tileStr === '@') {
                return { type: 'exit', value: 2 };
            }

            // Fragile tile
            if (tileStr === 'f') {
                return { type: 'fragile', value: 3 };
            }

            // Bridge tile (e.g., "ba", "bEb", "bDc")
            if (tileStr.startsWith('b')) {
                let active_status = false; // default
                let id = tileStr.substring(1);

                if (id.startsWith('E')) {
                    active_status = true;
                    id = id.substring(1);
                } else if (id.startsWith('D')) {
                    active_status = false;
                    id = id.substring(1);
                }

                return { type: 'bridge', value: 4, id, active: active_status };
            }

            // Simple switch (e.g., "sEa", "sDa", "sa")
            if (tileStr.startsWith('s')) {
                let mode = 'toggle'; // default
                let id = tileStr.substring(1);

                if (id.startsWith('E')) {
                    mode = 'enable';
                    id = id.substring(1);
                } else if (id.startsWith('D')) {
                    mode = 'disable';
                    id = id.substring(1);
                }

                return { type: 'switch', subtype: 'simple', value: 5, id, mode };
            }

            // Heavy switch (requires standing, e.g., "hEa", "hDa", "ha")
            if (tileStr.startsWith('h')) {
                let mode = 'toggle';
                let id = tileStr.substring(1);

                if (id.startsWith('E')) {
                    mode = 'enable';
                    id = id.substring(1);
                } else if (id.startsWith('D')) {
                    mode = 'disable';
                    id = id.substring(1);
                }

                return { type: 'switch', subtype: 'heavy', value: 6, id, mode };
            }

            // Teleport switch (e.g., "ta")
            if (tileStr.startsWith('t')) {
                const id = tileStr.substring(1);
                return { type: 'switch', subtype: 'teleport', value: 7, id };
            }

            // Default to normal tile
            return { type: 'normal', value: 1 };
        }

        // Convert parsed level to usable format
        function loadLevel(levelDef) {
            const parsed = parseLevelLayout(levelDef.layout);

            return {
                id: levelDef.id,
                name: levelDef.name,
                grid: parsed.grid,
                bridges: parsed.bridges,
                switches: parsed.switches,
                start: parsed.start
            };
        }

        let currentLevel = loadLevel(levelDefinitions[0]);

        // Three.js setup
        const canvas = document.getElementById('gameCanvas');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0a0a);

        const aspect = canvas.innerWidth / canvas.innerHeight
        const orthographicCamera = new THREE.OrthographicCamera();
        const perspectiveCamera = new THREE.PerspectiveCamera(45, canvas.width / canvas.height, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
        renderer.setSize(canvas.width, canvas.height);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;

        // (debug) grid
        if (ISDEBUG === true) {
            const geometry = new THREE.PlaneGeometry( 100, 100, 100, 100 );
            const material = new THREE.MeshBasicMaterial( { wireframe: true, opacity: 0.5, transparent: true } );
            const grid = new THREE.Mesh( geometry, material );
            grid.rotation.order = 'YXZ';
            grid.rotation.y = - Math.PI / 2;
            grid.rotation.x = - Math.PI / 2;
            scene.add(grid);
        }

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
        directionalLight.position.set(9.5, 12, 2.5);
        directionalLight.castShadow = true;
        directionalLight.shadow.mapSize.width = 2048;
        directionalLight.shadow.mapSize.height = 2048;
        directionalLight.shadow.camera.near = 0.5;
        directionalLight.shadow.camera.far = 50;

        // Game objects

        // const blockSideTexture = textureLoader.load('/assets/img/box_long_face.jpg', () => {

        // // Create materials using the loaded textures
        const tileMaterials = [

        // Build grid with special tile support
        function buildGrid() {
            // Clear existing grid
            gridTiles.forEach(tile => scene.remove(tile));
            gridTiles = [];
            if (exitTile) scene.remove(exitTile);

            const grid = currentLevel.grid;
            const tileSize = 1;
            const tileHeight = 0.2;
            const spacing = gameState.showGridSpacing ? 0.05 : 0;
            const adjustedSize = tileSize - (spacing * 2);

            for (let y = 0; y < grid.length; y++) {
                for (let x = 0; x < grid[y].length; x++) {
                    const tileData = grid[y][x];

                    if (tileData.type === 'empty') continue;

                    const geometry = new THREE.BoxGeometry(adjustedSize, tileHeight, adjustedSize);
                    let material;

                    // Choose material based on tile type
                    switch(tileData.type) {
                        case 'exit':
                            material = exitHoleMaterial.clone();
                            break;

                        case 'fragile':
                            material = fragileTileMaterials;
                            break;

                        case 'bridge':
                            material = new THREE.MeshStandardMaterial({
                                color: tileData.active ? 0x4169E1 : 0x1a1a2e,
                                roughness: 0.6,
                                metalness: 0.4,
                                transparent: !tileData.active,
                                opacity: tileData.active ? 0.8 : 0.3
                            });
                            break;

                        case 'switch':
                            let switchColor;
                            switch(tileData.subtype) {
                                case 'simple':
                                    switchColor = 0xFFD700; // Gold
                                    break;
                                case 'heavy':
                                    switchColor = 0xFF4500; // Orange-red
                                    break;
                                case 'teleport':
                                    switchColor = 0xFF00FF; // Magenta
                                    break;
                                default:
                                    switchColor = 0xFFD700;
                            }
                            material = new THREE.MeshStandardMaterial({
                                color: switchColor,
                                emissive: switchColor,
                                emissiveIntensity: 0.2,
                                roughness: 0.5,
                                metalness: 0.5
                            });
                            break;

                        default: // normal tile
                            material = tileMaterials//.clone();
                    }

                    const tile = new THREE.Mesh(geometry, material);
                    tile.position.set(x * tileSize, 0, y * tileSize);
                    tile.castShadow = false;
                    tile.receiveShadow = true;

                    // Store tile metadata
                    tile.userData = {
                        gridX: x,
                        gridY: y,
                        tileData: tileData
                    };

                    scene.add(tile);
                    gridTiles.push(tile);

                    if (tileData.type === 'exit') {
                        exitTile = tile;
                        currentLevel.exit = { x, y };

                        // Add glow effect
                        const glowGeometry = new THREE.BoxGeometry(adjustedSize * 0.9, 0.05, adjustedSize * 0.9);
                        const glow = new THREE.Mesh(glowGeometry, exitHoleGlowMaterial);
                        glow.position.y = -0.3;
                        tile.add(glow);
                    }

                    // Add visual indicator for switches
                    if (tileData.type === 'switch') {
                        let indicatorGeometry = new THREE.CylinderGeometry(0.35, 0.35, 0.2, 16);
                        let indicatorMaterial = new THREE.MeshStandardMaterial({
                            color: material.color,
                            emissive: material.color,
                            emissiveIntensity: 0.5
                        });
                        if (tileData.subtype === 'heavy') {
                            indicatorGeometry = new THREE.BoxGeometry(.6, .2, .6);
                            indicatorMaterial = new THREE.MeshStandardMaterial({
                                color: material.color,
                                emissive: material.color,
                                emissiveIntensity: 0.5
                            });

                        // // TODO: Add a switch type with 2 boxes in corners, showing the separation

                        let indicator = new THREE.Mesh(indicatorGeometry, indicatorMaterial);

        // Check for switch activation
        function checkSwitchActivation(x, y, orientation) {
            const tileData = getTileAt(x, y);

            if (!tileData || tileData.type !== 'switch') return;

            // Heavy switches require standing
            if (tileData.subtype === 'heavy' && orientation !== 'standing') return;

            // Activate switch
            activateSwitch(tileData.id, tileData.mode);
        }

        function activateSwitch(switchId, mode) {
            if (!currentLevel.bridges[switchId]) return;

            const bridgeTiles = currentLevel.bridges[switchId];

            bridgeTiles.forEach(pos => {
                const tileData = currentLevel.grid[pos.y][pos.x];

                switch(mode) {
                    case 'enable':
                        tileData.active = true;
                        break;
                    case 'disable':
                        tileData.active = false;
                        break;
                    case 'toggle':
                        tileData.active = !tileData.active;
                        break;
                }

                // Show glow based on the state change
                showBridgeActivationGlow(pos.x, pos.y, tileData.active);
            });

            // Rebuild grid to reflect changes
            buildGrid();
        }

        function showBridgeActivationGlow(x, y, isActivating) {
            const tileSize = 1;
            const glowColor = isActivating ? 0x00ff88 : 0xff4444; // Green for activate, red for deactivate

            // Create glow geometry - a flat plane slightly above the tile
            const glowGeometry = new THREE.PlaneGeometry(tileSize * 0.8, tileSize * 0.8);
            const glowMaterial = new THREE.MeshBasicMaterial({
                color: glowColor,
                transparent: true,
                opacity: 0.8,
                side: THREE.DoubleSide
            });

            const glow = new THREE.Mesh(glowGeometry, glowMaterial);
            glow.position.set(x * tileSize, 0.3, y * tileSize);
            glow.rotation.x = -Math.PI / 2; // Make it horizontal

            scene.add(glow);

            // Animate the glow fading out
            const startTime = Date.now();
            const duration = 800; // ms

            function animateGlow() {
                const elapsed = Date.now() - startTime;
                const progress = elapsed / duration;

                if (progress < 1) {
                    // Fade out and scale up slightly
                    glow.material.opacity = 0.8 * (1 - progress);
                    const scale = 1 + progress * 0.3;
                    glow.scale.set(scale, scale, 1);

                    requestAnimationFrame(animateGlow);
                } else {
                    // Remove the glow
                    scene.remove(glow);
                    glow.geometry.dispose();
                    glow.material.dispose();
                }
            }

            animateGlow();
        }


        // Helper to get tile at position
        function getTileAt(x, y) {
            if (!currentLevel.grid[y] || !currentLevel.grid[y][x]) return null;
            return currentLevel.grid[y][x];

        // Create player block
        function createPlayerBlock() {
            if (playerBlock) scene.remove(playerBlock);

            const blockWidth = 1.0;
            const blockHeight = 2.0;
            const geometry = new THREE.BoxGeometry(blockWidth, blockHeight, blockWidth);
            playerBlock = new THREE.Mesh(geometry, blockMaterial);
            playerBlock.castShadow = true;
            playerBlock.receiveShadow = true;

            // Restore original color (may be needed if the block fell and was darkened)
            playerBlock.material.color = new THREE.Color(defaultBlockColor);

            updateBlockPosition(false);
            scene.add(playerBlock);
        }

        // Update block position based on game state
        function updateBlockPosition(animate = true, direction = null) {
            const { x, y } = gameState.blockPosition;
            const tileSize = 1;

            let targetPosition = new THREE.Vector3(x * tileSize, 0, y * tileSize);
            let targetRotation = new THREE.Euler(0, 0, 0);

            // Adjust height based on orientation
            switch (gameState.blockOrientation) {
                case 'standing':
                    targetPosition.y = 1.1; // Half of 2.0 (block height) + 0.1 (tile height)
                    break;
                case 'lying-x':
                    targetPosition.y = 0.6; // Half of 1.0 (block width) + 0.1
                    // targetRotation.z = -Math.PI / 2;
                    break;
                case 'lying-y':
                    targetPosition.y = 0.6;
                    // targetRotation.x = Math.PI / 2;
                    break;
            }

            // Adjust rotation based on direction
            //
            //                Z+
            //                |
            //                |
            //                |
            //                ^
            //              /   \
            //             /     \
            //      down  /       \  right
            //           Y+        X+
            //
            //
            switch (direction) {
                case 'up':
                    targetRotation.x -= Math.PI / 2;  // Rotate clockwise in the negative Y direction
                    break;
                case 'right':
                    targetRotation.z += Math.PI / 2;  // Rotate clockwise in the negative X direction
                    break;
                case 'down':
                    targetRotation.x += Math.PI / 2;  // Rotate clockwise in the positive Y direction
                    break;
                case 'left':
                    targetRotation.z = Math.PI / 2;  // Rotate clockwise in the positive X direction
                    break;
            }

            if (animate && playerBlock) {
                animateBlock(targetPosition, targetRotation);
            } else if (playerBlock) {
                playerBlock.position.copy(targetPosition);
                playerBlock.rotation.copy(targetRotation);
            }
        }

        // Animate block movement
        function animateBlock(targetPosition, targetRotation) {
            if (!playerBlock) return;

            gameState.isAnimating = true;
            const startPosition = playerBlock.position.clone();
            const startRotation = playerBlock.rotation.clone();
            const duration = 400; // ms
            const startTime = Date.now();

            function animate() {
                const elapsed = Date.now() - startTime;
                const progress = Math.min(elapsed / duration, 1);
                const eased = easeInOutCubic(progress);

                playerBlock.position.lerpVectors(startPosition, targetPosition, eased);
                playerBlock.rotation.x = startRotation.x + (targetRotation.x - startRotation.x) * eased;
                playerBlock.rotation.y = startRotation.y + (targetRotation.y - startRotation.y) * eased;
                playerBlock.rotation.z = startRotation.z + (targetRotation.z - startRotation.z) * eased;

                if (progress < 1) {
                    requestAnimationFrame(animate);
                } else {
                    gameState.isAnimating = false;
                    checkExitTile();
                }
            }

            animate();
        }

        function easeInOutCubic(t) {
            return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
        }

        // Calculate block footprint
        function getBlockFootprint() {
            const { x, y } = gameState.blockPosition;
            const orientation = gameState.blockOrientation;

            switch (orientation) {
                case 'standing':
                    return [{ x, y }];
                case 'lying-x':
                    return [{ x, y }, { x: x + 1, y }];
                case 'lying-y':
                    return [{ x, y }, { x, y: y + 1 }];
                default:
                    return [{ x, y }];
            }
        }

        // Check if position is valid
        function isValidPosition(x, y) {
            const tileData = getTileAt(x, y);
            if (!tileData) return false;

            // Empty tiles are invalid
            if (tileData.type === 'empty') return false;

            // Inactive bridges are invalid
            if (tileData.type === 'bridge' && !tileData.active) return false;

            return true;
        }

        // Check fragile tile breaking
        function checkFragileTile(x, y, orientation) {
            const tileData = getTileAt(x, y);

            if (tileData && tileData.type === 'fragile') {
                // Fragile tiles break if standing on them
                if (orientation === 'standing') {
                    // Make tile disappear
                    tileData.type = 'empty';
                    tileData.value = 0;

                    // Rebuild to show broken tile
                    setTimeout(() => {
                        buildGrid();
                        // animateTileFalling(x, y);
                        animateBlockFalling(x, y, orientation, 'in-place');
                    }, 500);

                    return true; // Tile broke
                }
            }

            return false; // Tile didn't break
        }

        // Move block
        function moveBlock(direction) {
            if (gameState.isAnimating || gameState.isResetting || gameState.hasWon) return;

            const { x, y } = gameState.blockPosition;
            const orientation = gameState.blockOrientation;
            let newX = x, newY = y, newOrientation = orientation;

            // Calculate new position and orientation based on tipping
            switch (direction) {
                case 'up':
                    if (orientation === 'standing') {
                        newY = y - 2;
                        newOrientation = 'lying-y';
                    } else if (orientation === 'lying-y') {
                        newY = y - 1;
                        newOrientation = 'standing';
                    } else if (orientation === 'lying-x') {
                        newY = y - 1;
                        newOrientation = 'lying-x';
                    }
                    break;
                case 'down':
                    if (orientation === 'standing') {
                        newY = y + 1;
                        newOrientation = 'lying-y';
                    } else if (orientation === 'lying-y') {
                        newY = y + 2;
                        newOrientation = 'standing';
                    } else if (orientation === 'lying-x') {
                        newY = y + 1;
                        newOrientation = 'lying-x';
                    }
                    break;
                case 'left':
                    if (orientation === 'standing') {
                        newX = x - 2;
                        newOrientation = 'lying-x';
                    } else if (orientation === 'lying-x') {
                        newX = x - 1;
                        newOrientation = 'standing';
                    } else if (orientation === 'lying-y') {
                        newX = x - 1;
                        newOrientation = 'lying-y';
                    }
                    break;
                case 'right':
                    if (orientation === 'standing') {
                        newX = x + 1;
                        newOrientation = 'lying-x';
                    } else if (orientation === 'lying-x') {
                        newX = x + 2;
                        newOrientation = 'standing';
                    } else if (orientation === 'lying-y') {
                        newX = x + 1;
                        newOrientation = 'lying-y';
                    }
                    break;
            }

            // Validate all footprint positions
            const testState = { x: newX, y: newY, orientation: newOrientation };
            const footprint = getFootprintForState(testState);
            const valid = footprint.every(pos => isValidPosition(pos.x, pos.y));

            // Store previous state for animation
            const prevX = gameState.blockPosition.x;
            const prevY = gameState.blockPosition.y;
            const prevOrientation = gameState.blockOrientation;

            gameState.blockPosition = { x: newX, y: newY };
            gameState.blockOrientation = newOrientation;
            gameState.moves++;

            if (valid) {
                // updateBlockPosition(true, direction);
                animateBlockTippingQuaternion(prevX, prevY, prevOrientation, direction);
                // animateBlockTippingDirectAngle(prevX, prevY, prevOrientation, direction);

                // After animation completes, check for special tiles
                // setTimeout(() => {
                // Check switch activation
                const footprint = getBlockFootprint();
                footprint.forEach(pos => {
                    checkSwitchActivation(pos.x, pos.y, gameState.blockOrientation);
                });

                // Check fragile tiles (only check center tile)
                const didBreak = checkFragileTile(gameState.blockPosition.x, gameState.blockPosition.y, gameState.blockOrientation);

                // }, /** duration + **/ 1050); // Slight delay after animation
            } else {
                // Invalid move - animate falling off
                animateBlockFalling(prevX, prevY, prevOrientation, direction);
            }

            updateDisplay();
        }

        function animateBlockTippingQuaternion(prevX, prevY, prevOrientation, direction) {
            if (!playerBlock) return;

            const tileSize = 1;
            const { x: newX, y: newY } = gameState.blockPosition;
            const newOrientation = gameState.blockOrientation;

            gameState.isAnimating = true;
            const duration = 400;
            const startTime = Date.now();

            const startPos = playerBlock.position.clone();
            const startRot = playerBlock.rotation.clone(); // Store current rotation as THREE.Vector3
            // console.log(`StartPos: (${startPos.x}, ${startPos.y}, ${startPos.z}); StartRot: (${startRot.x}, ${startRot.y}, ${startRot.z})`);

            const targetPos = new THREE.Vector3(
                newX * tileSize,
                newOrientation === 'standing' ? 1.1 : 0.6,
                newY * tileSize
            );

            // Create a quaternion for the new rotation
            const quaternion = new THREE.Quaternion();

            switch (direction) {
                case 'up':
                    quaternion.setFromAxisAngle(new THREE.Vector3(1, 0, 0), -Math.PI / 2);
                    if (newOrientation == 'lying-y') {
                        targetPos.z += .5;
                    } else if (newOrientation == 'lying-x') {
                        targetPos.x += .5;
                    }
                    break;
                case 'down':
                    quaternion.setFromAxisAngle(new THREE.Vector3(1, 0, 0), Math.PI / 2);
                    if (newOrientation == 'lying-y') {
                        targetPos.z += .5;
                    } else if (newOrientation == 'lying-x') {
                        targetPos.x += .5;
                    }
                    break;
                case 'left':
                    quaternion.setFromAxisAngle(new THREE.Vector3(0, 0, 1), Math.PI / 2);
                    if (newOrientation == 'lying-x') {
                        targetPos.x += .5;
                    } else if (newOrientation == 'lying-y') {
                        targetPos.z += .5;
                    }
                    break;
                case 'right':
                    quaternion.setFromAxisAngle(new THREE.Vector3(0, 0, 1), -Math.PI / 2);
                    if (newOrientation == 'lying-x') {
                        targetPos.x += .5;
                    } else if (newOrientation == 'lying-y') {
                        targetPos.z += .5;
                    }
                    break;
            }

            // Combine with current rotation
            const startQuaternion = new THREE.Quaternion().setFromEuler(startRot);
            const newQuaternion = new THREE.Quaternion().multiplyQuaternions(quaternion, new THREE.Quaternion().setFromEuler(startRot));

            // Normalize the start and target quaternions before interpolation
            startQuaternion.normalize();
            newQuaternion.normalize();

            // // Check if quaternion is defined and log details
            // if (startQuaternion) {
            //     console.log(`Start Quaternion:
            //     x: ${startQuaternion.x},
            //     y: ${startQuaternion.y},

            //     // Check if the quaternion is valid (non-zero and normalized)

            // } else {
            //     console.error('Error: startQuaternion is undefined');
            // }


            // // Check if quaternion is defined and log details
            // if (newQuaternion) {
            //     console.log(`New Quaternion:
            //     x: ${newQuaternion.x},
            //     y: ${newQuaternion.y},
            //     z: ${newQuaternion.z},
            //     w: ${newQuaternion.w}`);

            //     // Check if the quaternion is valid (non-zero and normalized)
            //     console.log(`Is Quaternion Valid? ${newQuaternion.length() > 0 ? 'Yes' : 'No'}`);

            //     // Logging the length to check if it is normalized
            //     console.log(`Quaternion Length: ${newQuaternion.length()}`);
            // } else {
            //     console.error('Error: newQuaternion is undefined');
            // }

            function animate() {
                const elapsed = Date.now() - startTime;
                const progress = Math.min(elapsed / duration, 1);
                const eased = easeInOutCubic(progress);

                // Calculate new position
                playerBlock.position.lerpVectors(startPos, targetPos, eased);

                // Interpolate rotation using Euler angles in the animate function
                let interpolatedQuaternion = new THREE.Quaternion(); // Initialize this variable

                // Interpolating the rotation
                interpolatedQuaternion.slerp(startQuaternion, newQuaternion, eased);

                // // Interpolate rotation using Euler angles
                // let interpolatedQuaternion = new THREE.Quaternion().slerpQuaternions(new THREE.Quaternion().setFromEuler(startRot), newQuaternion, eased);

                // // Check if interpolatedQuaternion is defined and log details
                // if (interpolatedQuaternion) {
                //     console.log(`Interpolated Quaternion (after slerp):
                //     x: ${interpolatedQuaternion.x},
                //     y: ${interpolatedQuaternion.y},

                //     console.log(`Is Quaternion Valid? ${interpolatedQuaternion.length() > 0 ? 'Yes' : 'No'}`);

                // } else {
                //     console.error('Error: interpolatedQuaternion is undefined');
                // }

                // playerBlock.rotation.setFromQuaternion(interpolatedQuaternion);  // THIS IS CAUSING FAILURES TO EVEN MOVE!!!

                if (progress < 1) {

                    // console.log(`Quaternion (after animating):

        // Animate block tipping with proper pivot rotation
        function animateBlockTippingDirectAngle(prevX, prevY, prevOrientation, direction) {
            if (!playerBlock) return;

            const tileSize = 1;
            const { x: newX, y: newY } = gameState.blockPosition;
            const newOrientation = gameState.blockOrientation;

            gameState.isAnimating = true;
            const duration = 400;
            const startTime = Date.now();

            const startPos = playerBlock.position.clone();
            const startRot = playerBlock.rotation.clone();

            const targetPos = new THREE.Vector3(
                newX * tileSize,
                newOrientation === 'standing' ? 1.1 : 0.6,
                newY * tileSize
            );

            // Adjust rotation based on direction
            //
            //                Z+
            //                |
            //                |
            //                |
            //                ^
            //              /   \
            //             /     \
            //      down  /       \  right
            //           Y+        X+
            //
            //

            let x_rotation = playerBlock.rotation.x;
            let z_rotation = playerBlock.rotation.z;
            switch (direction) {
                case 'up':
                    x_rotation -= Math.PI / 2;
                    break;
                case 'down':
                    x_rotation += Math.PI / 2;
                    break;
                case 'left':
                    z_rotation += Math.PI / 2;
                    break;
                case 'right':
                    z_rotation -= Math.PI / 2;
                    break;
            }

            const targetRot = {
                x: x_rotation,
                y: playerBlock.rotation.y,
                z: z_rotation // newOrientation === 'lying-x' ? Math.PI / 2 : 0
            };

            function animate() {
                const elapsed = Date.now() - startTime;
                const progress = Math.min(elapsed / duration, 1);
                const eased = easeInOutCubic(progress);

                // Arc motion for tipping
                const arcHeight = 0.3;
                playerBlock.position.x = startPos.x + (targetPos.x - startPos.x) * eased;
                playerBlock.position.y = startPos.y + (targetPos.y - startPos.y) * eased +
                    Math.sin(eased * Math.PI) * arcHeight;
                playerBlock.position.z = startPos.z + (targetPos.z - startPos.z) * eased;

                // Interpolate rotation
                playerBlock.rotation.x = startRot.x + (targetRot.x - startRot.x) * eased;
                playerBlock.rotation.y = startRot.y + (targetRot.y - startRot.y) * eased;
                playerBlock.rotation.z = startRot.z + (targetRot.z - startRot.z) * eased;

                if (progress < 1) {
                    requestAnimationFrame(animate);
                } else {
                    // Snap to final position
                    playerBlock.position.copy(targetPos);
                    playerBlock.rotation.x = targetRot.x;
                    playerBlock.rotation.y = targetRot.y;
                    playerBlock.rotation.z = targetRot.z;

                    gameState.isAnimating = false;
                    checkExitTile();
                }
            }

            animate();
        }

        // Animate block falling off the grid
        function animateBlockFalling(prevX, prevY, prevOrientation, direction, reset = true) {
            if (!playerBlock) return;

            gameState.isAnimating = true;
            const duration = 1200;
            const startTime = Date.now();
            const tileSize = 1;

            const startPos = playerBlock.position.clone();
            const startRot = { x: playerBlock.rotation.x, y: playerBlock.rotation.y, z: playerBlock.rotation.z };
            const startColor = new THREE.Color(blockMaterial.color);
            const endColor = new THREE.Color(0x000000);

            // Calculate fall direction
            let fallDirX = 0, fallDirZ = 0;
            switch (direction) {
                case 'up': fallDirZ = -1; break;
                case 'down': fallDirZ = 1; break;
                case 'left': fallDirX = -1; break;
                case 'right': fallDirX = 1; break;
                case 'in-place': break;
            }

            function fallAnimate() {
                const elapsed = Date.now() - startTime;
                const progress = Math.min(elapsed / duration, 1);

                // Parabolic fall with rotation
                // TODO: Works... but fails with gimbal lock/local rotation issues without quaternions.

                const fallDistance = 5;
                const horizontalProgress = progress * 2; // Move faster horizontally
                const verticalProgress = progress * progress * 2; // Accelerate downward

                playerBlock.position.x = startPos.x + fallDirX * horizontalProgress * fallDistance;
                playerBlock.position.y = startPos.y - verticalProgress * fallDistance;
                playerBlock.position.z = startPos.z + fallDirZ * horizontalProgress * fallDistance;

                // Tumbling rotation
                playerBlock.rotation.x = startRot.x + progress * Math.PI * 2 * fallDirZ;
                playerBlock.rotation.z = startRot.z + progress * Math.PI * 2 * -fallDirX;

                // Fade to black
                const currentColor = new THREE.Color().lerpColors(startColor, endColor, progress);
                playerBlock.material.color.copy(currentColor);

                if (progress < 1) {
                    requestAnimationFrame(fallAnimate);
                } else {
                    gameState.isAnimating = false;
                    gameState.isResetting = true;
                    // Reset level after falling
                    setTimeout(() => {
                        if (reset) {
                            resetLevel();
                        }
                    }, 500);
                }
            }

            fallAnimate();
        }

        function getFootprintForState(state) {
            const { x, y, orientation } = state;
            switch (orientation) {
                case 'standing':
                    return [{ x, y }];
                case 'lying-x':
                    return [{ x, y }, { x: x + 1, y }];
                case 'lying-y':
                    return [{ x, y }, { x, y: y + 1 }];
                default:
                    return [{ x, y }];
            }
        }

        // Check win condition
        function checkExitTile() {
            const { x, y } = gameState.blockPosition;
            const tileData = getTileAt(x, y);
            const exit = currentLevel.exit;

            if (tileData && tileData.type == 'exit') {
                if (gameState.blockOrientation === 'standing'){
                    setTimeout(() => {
                        animateBlockFalling(x, y, 'standing', 'in-place', reset = false);

                        setTimeout(() => {
                            winLevel();
                        }, 100);
                    }, 100);

                    return true;
                }
            }

            return false;
        }

        // Win level
        function winLevel() {
            if (gameState.isAnimating) {
                // Wait for animation to finish
                setTimeout(winLevel, 100);
                return;
            }

            gameState.hasWon = true;
            document.getElementById('finalMoves').textContent = gameState.moves;
            document.getElementById('winMessage').classList.add('show');
        }

        // Next level
        function nextLevel() {
            document.getElementById('winMessage').classList.remove('show');
            gameState.level++;

            if (gameState.level <= levelDefinitions.length) {
                currentLevel = loadLevel(levelDefinitions[gameState.level - 1]);
                resetLevel();
            } else {
                alert('Congratulations! You completed all levels and finished the game!');
                gameState.level = 1;
                currentLevel = loadLevel(levelDefinitions[gameState.level - 1]);
                resetLevel();
            }
        }

        // Reset level
        function resetLevel() {
            currentLevel = loadLevel(levelDefinitions[gameState.level - 1]);
            gameState.blockPosition = { ...currentLevel.start };
            gameState.blockOrientation = 'standing';
            gameState.moves = 0;
            gameState.isAnimating = false;
            gameState.isResetting = false;
            gameState.hasWon = false;

            buildGrid();
            createPlayerBlock();
            updateCamera();
            updateDisplay();
        }

        // Update display
        function updateDisplay() {
            document.getElementById('levelDisplay').textContent = gameState.level;
            document.getElementById('moveDisplay').textContent = gameState.moves;
            document.getElementById('passcodeDisplay').textContent = levelDefinitions[gameState.level - 1].password.toUpperCase() || '-----';
        }

        // Toggle camera
        function toggleCamera() {
            gameState.cameraMode = gameState.cameraMode === 'isometric' ? 'top' : 'isometric';
            updateCamera();
        }

        function updateCamera() {
            const grid = currentLevel.grid;
            const gridWidth = grid[0].length;
            const gridHeight = grid.length;

            // Calculate grid bounds
            const centerX = (gridWidth - 1) / 2;
            const centerY = (gridHeight - 1) / 2;

            // Calculate distance needed to fit the entire grid
            // Use a minimum distance for small grids, scale up for larger ones
            const maxDimension = Math.max(gridWidth, gridHeight);
            const minDistance = 6; // Minimum distance for small grids
            const baseDist = Math.max(minDistance, maxDimension * .8);

            if (gameState.cameraMode === 'isometric') {
                camera = orthographicCamera;
                const orthoBaseDist = baseDist * .7;
                camera.left = -orthoBaseDist;
                camera.right = orthoBaseDist;
                camera.top = orthoBaseDist;
                camera.bottom = -orthoBaseDist;
                console.log(`Camera ratio: W:${gridWidth}, H:${gridHeight}, r:${gridWidth/gridHeight}`)
                // camera.position.set(100, 100, 100);
                // camera = perspectiveCamera;
                camera.position.set(centerX + orthoBaseDist / 5, 7, centerY + orthoBaseDist);
                camera.lookAt(centerX, 0, centerY);
                camera.updateProjectionMatrix();
            } else {
                camera = perspectiveCamera;
                // camera.position.set(centerX + 30, 30, centerY + 30);
                camera.position.set(centerX, baseDist * 1.8, centerY);
                camera.lookAt(centerX, 0, centerY);
            }
        }

        // Open password modal
        function openPasswordModal() {
            // Create modal if it doesn't exist
            let modal = document.getElementById('passcodeModal');
            if (!modal) {
                gameState.passwordModalOpen = true;
                createPasswordModal();
                modal = document.getElementById('passcodeModal');
            }

            modal.classList.add('show');

            // Clear inputs
            for (let i = 1; i <= 5; i++) {
                const input = document.getElementById(`pass${i}`);
                if (input) {
                    input.value = '';
                    input.classList.remove('error');
                }
            }

            // Clear message
            const messageEl = document.getElementById('passcodeMessage');
            if (messageEl) {
                messageEl.textContent = '';
            }

            // Focus first input
            setTimeout(() => {
                const firstInput = document.getElementById('pass1');
                if (firstInput) firstInput.focus();
            }, 100);
        }

        function closePasswordModal() {
            const modal = document.getElementById('passcodeModal');
            if (modal) {
                modal.classList.remove('show');
                gameState.passwordModalOpen = false;
            }
        }

        function createPasswordModal() {
            const modalHTML = `
                <div class="passcode-modal" id="passcodeModal">
                    <div class="passcode-content">
                        <h2 class="passcode-title">🔢 Enter Level Passcode</h2>
                        <p style="color: rgba(255, 255, 255, 0.7); font-size: 0.9rem; margin-bottom: 15px;">
                            Enter a 5-character code to jump to a level
                        </p>
                        <div class="passcode-input-container">
                            <input type="text" class="passcode-input" id="pass1" maxlength="1">
                            <input type="text" class="passcode-input" id="pass2" maxlength="1">
                            <input type="text" class="passcode-input" id="pass3" maxlength="1">
                            <input type="text" class="passcode-input" id="pass4" maxlength="1">
                            <input type="text" class="passcode-input" id="pass5" maxlength="1">
                        </div>
                        <div class="passcode-message" id="passcodeMessage"></div>
                        <div class="passcode-buttons">
                            <button class="passcode-btn" onclick="submitPasscode()">Submit</button>
                            <button class="passcode-btn passcode-cancel" onclick="closePasswordModal()">Cancel</button>
                        </div>
                    </div>
                </div>
            `;

            document.body.insertAdjacentHTML('beforeend', modalHTML);
            setupPasswordInputs();
        }

        function setupPasswordInputs() {
            const inputs = [];
            for (let i = 1; i <= 5; i++) {
                const input = document.getElementById(`pass${i}`);
                if (input) inputs.push(input);
            }

            inputs.forEach((input, index) => {
                input.addEventListener('input', function() {
                    // Allow alphanumeric
                    this.value = this.value.replace(/[^a-zA-Z0-9]/g, '').toLowerCase();

                    // Move to next input if filled
                    if (this.value.length === 1 && index < inputs.length - 1) {
                        inputs[index + 1].focus();
                    }

                    // Clear error state
                    this.classList.remove('error');
                });

                // Handle paste
                input.addEventListener('paste', function(e) {
                    e.preventDefault();
                    const pastedText = e.clipboardData.getData('text').toLowerCase().replace(/[^a-zA-Z0-9]/g, '');

                    for (let i = 0; i < Math.min(pastedText.length, 5 - index); i++) {
                        inputs[index + i].value = pastedText[i];
                    }

                    // Focus next empty or last input
                    const nextEmpty = inputs.findIndex((inp, idx) => idx > index && inp.value === '');
                    if (nextEmpty !== -1) {
                        inputs[nextEmpty].focus();
                    } else {
                        inputs[4].focus();
                    }
                });
            });
        }

        function submitPasscode() {
            const inputs = [];
            for (let i = 1; i <= 5; i++) {
                const input = document.getElementById(`pass${i}`);
                if (input) inputs.push(input);
            }

            const passcode = inputs.map(input => input.value).join('').toLowerCase();
            const messageEl = document.getElementById('passcodeMessage');

            if (passcode.length !== 5) {
                if (messageEl) messageEl.textContent = 'Please enter all 5 characters';
                inputs.forEach(input => input.classList.add('error'));
                return;
            }

            // Find level with matching passcode
            const levelIndex = levelDefinitions.findIndex(level =>
                level.password && level.password.toLowerCase() === passcode
            );

            if (levelIndex !== -1) {
                // Success! Load the level
                gameState.level = levelIndex + 1;
                currentLevel = loadLevel(levelDefinitions[levelIndex]);
                closePasswordModal();
                resetLevel();
            } else {
                // Invalid passcode
                if (messageEl) messageEl.textContent = 'Invalid passcode. Try again.';
                inputs.forEach(input => input.classList.add('error'));
            }
        }

        function loadLevelByPassword(password) {
            const levelIndex = levelDefinitions.findIndex(level =>
                level.password && level.password.toLowerCase() === password.toLowerCase()
            );

            if (levelIndex !== -1) {
                gameState.level = levelIndex + 1;
                currentLevel = loadLevel(levelDefinitions[levelIndex]);
                resetLevel();
                return true;
            }

            return false;
        }

        // Touch/Swipe controls
        let touchStartX = 0;
        let touchStartY = 0;
        let touchEndX = 0;
        let touchEndY = 0;

        canvas.addEventListener('touchstart', (e) => {
            touchStartX = e.changedTouches[0].screenX;
            touchStartY = e.changedTouches[0].screenY;
        }, false);

        canvas.addEventListener('touchend', (e) => {
            touchEndX = e.changedTouches[0].screenX;
            touchEndY = e.changedTouches[0].screenY;
            handleSwipe();
        }, false);

        function handleSwipe() {
            const deltaX = touchEndX - touchStartX;
            const deltaY = touchEndY - touchStartY;
            const minSwipeDistance = 30;

            if (Math.abs(deltaX) < minSwipeDistance && Math.abs(deltaY) < minSwipeDistance) {
                return;
            }

            if (Math.abs(deltaX) > Math.abs(deltaY)) {
                // Horizontal swipe
                if (deltaX > 0) {
                    moveBlock('right');
                } else {
                    moveBlock('left');
                }
            } else {
                // Vertical swipe
                if (deltaY > 0) {
                    moveBlock('down');
                } else {
                    moveBlock('up');
                }
            }
        }

        // Keyboard controls
        document.addEventListener('keydown', (e) => {
            if (gameState.isAnimating || gameState.isResetting || gameState.hasWon || gameState.passwordModalOpen) return;

            switch (e.key.toLowerCase()) {
                case 'arrowup':
                case 'w':
                    e.preventDefault();
                    moveBlock('up');
                    break;
                case 'arrowdown':
                case 's':
                    e.preventDefault();
                    moveBlock('down');
                    break;
                case 'arrowleft':
                case 'a':
                    e.preventDefault();
                    moveBlock('left');
                    break;
                case 'arrowright':
                case 'd':
                    e.preventDefault();
                    moveBlock('right');
                    break;
                // case 'r':
                //     resetLevel();
                //     break;
                case 'c':
                    toggleCamera();
                    break;
            }
        });

        // Animation loop
        function animate() {
            requestAnimationFrame(animate);

            // Pulse exit tile
            if (exitTile && exitTile.children[0]) {
                const time = Date.now() * 0.002;
                exitTile.children[0].material.opacity = 0.2 + Math.sin(time) * 0.1;
            }

            renderer.render(scene, camera);
        }

        // Handle window resize
        window.addEventListener('resize', () => {
            const container = document.getElementById('canvasContainer');
            const maxWidth = Math.min(window.innerWidth * 0.9, 600);
            const maxHeight = Math.min(window.innerHeight * 0.6, 600);
            const size = Math.min(maxWidth, maxHeight);

            canvas.width = size;
            canvas.height = size;
            renderer.setSize(size, size);
            camera.aspect = 1;
            camera.updateProjectionMatrix();
        });

        // Initialize game
        function init() {
            resetLevel();
            updateCamera();
            animate();
        }

        init();
    </script>
